services:
  db:
    image: vinaikumarp/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: deployment_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_tracker_password_change_me}
    volumes:
      - tracker_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    image: vinaikumarp/nodejs-frontend:v1
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tracker_user
      DB_PASSWORD: ${DB_PASSWORD:-local_tracker_password_change_me}
      DB_NAME: deployment_tracker
      TRACKER_API_KEY: ${TRACKER_API_KEY:-local_demo_key_change_me}
    depends_on:
      db:
        condition: service_healthy
volumes:
  tracker_mysql_data:
