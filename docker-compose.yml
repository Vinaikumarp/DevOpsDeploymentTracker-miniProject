services:
  db:
    image: vinaikumarp/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: deployment_tracker
      MYSQL_USER: tracker_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_tracker_password_change_me}
    volumes:
      - tracker_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 500M
        limits:
          cpus: "1.5"
          memory: 1000M
  app:
    image: vinaikumarp/nodejs-frontend:v1
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tracker_user
      DB_PASSWORD: ${DB_PASSWORD:-dbroot123}
      DB_NAME: deployment_tracker
      TRACKER_API_KEY: ${TRACKER_API_KEY:-local_demo_key_change_me}
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 500M
        limits:
          cpus: "1.5"
          memory: 1000M
    depends_on:
      db:
        condition: service_healthy
volumes:
  tracker_mysql_data:
